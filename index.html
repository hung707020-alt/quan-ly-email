<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh sách Email Online</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
        }
        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #4a2d82;
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sub-title {
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            resize: vertical;
        }
        textarea::placeholder {
            color: #9ca3af;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-add-small {
            font-size: 15px;
            padding: 12px;
        }
        .btn-get-large {
            font-size: 20px;
            padding: 18px;
        }
        .btn-blue { background-color: #007bff; }
        .btn-red { background-color: #dc3545; }
        .btn-yellow { background-color: #ffc107; color: #000000; }
        .btn-green { background-color: #28a745; }

        .output-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .output-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #ffffff;
        }
        .output-group input::placeholder {
            color: #9ca3af;
        }
        .btn-icon-square {
            width: 55px;
            margin-bottom: 0;
            background-color: #007bff;
            border-radius: 8px;
            font-size: 18px;
        }
        .counter {
            font-size: 17px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #customToast {
            background: #d4edda;
            color: #155724;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">✉️ Quản lý danh sách Email Online</div>
    <div class="sub-title">MAIL ĐÁNH</div>
    
    <div id="customToast">Đã lưu tự động!</div>

    <textarea id="emailListInput" placeholder="Dán email, text rác, phân cách bất kỳ (| ;, space ...)"></textarea>

    <!-- Nút Thêm Email -->
    <button class="btn-blue btn-add-small" id="btnAddEmail">
        <span style="font-size: 20px; margin-right: -2px;">+</span> Thêm Email Vào Danh Sách
    </button>

    <!-- Nút Xóa Danh Sách Email -->
    <button class="btn-red" id="btnDeleteAll">
        <span style="font-size: 20px;">🗑️</span> Xóa Danh Sách Email
    </button>

    <div class="output-group">
        <input type="text" id="singleEmailOutput" placeholder="Email sẽ xuất hiện ở đây">
        <button class="btn-blue btn-icon-square" id="btnCopySingle">📋</button>
    </div>

    <div class="counter" id="emailCounter">
        <span>📊</span> Số email còn lại: 0
    </div>

    <!-- Nút Clear Log Copy -->
    <button class="btn-yellow" id="btnClearLog">
        <span style="font-size: 20px; margin-right: 2px;">✏️</span> Clear Log Copy
    </button>

    <!-- Nút Lấy & Copy Email -->
    <button class="btn-green btn-get-large" id="btnGetAndCopy">
        <span style="font-size: 26px; margin-right: 3px;">📋</span> Lấy & Copy Email
    </button>
</div>

<script>
    const textarea = document.getElementById('emailListInput');
    const singleOutput = document.getElementById('singleEmailOutput');
    const counter = document.getElementById('emailCounter');
    const toast = document.getElementById('customToast');
    
    const btnAddEmail = document.getElementById('btnAddEmail');
    const btnDeleteAll = document.getElementById('btnDeleteAll');
    const btnCopySingle = document.getElementById('btnCopySingle');
    const btnClearLog = document.getElementById('btnClearLog');
    const btnGetAndCopy = document.getElementById('btnGetAndCopy');

    // 1. Tự động tải lại dữ liệu khi mở trang
    window.addEventListener('DOMContentLoaded', () => {
        const savedData = localStorage.getItem('saved_email_list');
        if (savedData !== null) {
            textarea.value = savedData;
            updateCounter();
        }
    });

    // 2. Tự động lưu ngầm và lọc bỏ trùng lặp khi người dùng nhập/dán dữ liệu
    textarea.addEventListener('input', () => {
        processAndSave();
        showToast("Đã lưu & lọc email trùng!");
    });

    // 3. Nút "Thêm Email Vào Danh Sách" (Thực hiện lọc trùng thủ công)
    btnAddEmail.addEventListener('click', () => {
        processAndSave();
        showToast("Đã cập nhật & loại bỏ email trùng!");
    });

    // 4. Nút "Xóa Danh Sách Email"
    btnDeleteAll.addEventListener('click', () => {
        if (confirm("Bạn có chắc chắn muốn xóa toàn bộ danh sách không?")) {
            textarea.value = '';
            singleOutput.value = '';
            localStorage.removeItem('saved_email_list');
            localStorage.removeItem('copied_email_history'); // Xóa cả lịch sử log đã copy
            updateCounter();
            showToast("Đã xóa sạch danh sách!");
        }
    });

    // 5. Nút "Lấy & Copy Email" (Kiểm tra cảnh báo trùng lịch sử & bốc email)
    btnGetAndCopy.addEventListener('click', () => {
        let lines = textarea.value.split('\n').map(item => item.trim()).filter(item => item !== '');
        if (lines.length === 0) {
            alert("Danh sách đang trống!");
            return;
        }

        let firstEmail = lines[0];

        // Kiểm tra xem email này đã từng được copy trước đó chưa (Lịch sử log)
        let copiedHistory = JSON.parse(localStorage.getItem('copied_email_history') || '[]');
        let isDuplicateInHistory = copiedHistory.includes(firstEmail);

        // Đưa xuống ô kết quả
        singleOutput.value = firstEmail;

        // Xóa email đó khỏi danh sách chính
        lines.shift();
        textarea.value = lines.join('\n');
        processAndSave();

        // Lưu vào lịch sử đã copy
        if (!isDuplicateInHistory) {
            copiedHistory.push(firstEmail);
            localStorage.setItem('copied_email_history', JSON.stringify(copiedHistory));
        }

        // Copy vào clipboard kèm thông báo cảnh báo nếu bị trùng lịch sử
        navigator.clipboard.writeText(firstEmail).then(() => {
            if (isDuplicateInHistory) {
                showToast("⚠️ CẢNH BÁO: Email này đã từng copy trước đó!");
            } else {
                showToast("Đã lấy và copy thành công!");
            }
        }).catch(() => {
            showToast("Đã lấy email thành công!");
        });
    });

    // 6. Nút copy ở ô vuông cạnh ô kết quả đơn
    btnCopySingle.addEventListener('click', () => {
        if (!singleOutput.value) {
            alert("Không có email nào để copy!");
            return;
        }
        navigator.clipboard.writeText(singleOutput.value).then(() => {
            showToast("Đã copy email từ ô kết quả!");
        });
    });

    // 7. Nút "Clear Log Copy" (Xóa sạch ô hiển thị email đơn và lịch sử đã copy)
    btnClearLog.addEventListener('click', () => {
        singleOutput.value = '';
        localStorage.removeItem('copied_email_history');
        showToast("Đã xóa sạch Log Copy!");
    });

    // Hàm xử lý: Tự động lọc bỏ các email bị trùng lặp trong danh sách chính và lưu vào localStorage
    function processAndSave() {
        const text = textarea.value;
        if (!text.trim()) {
            localStorage.setItem('saved_email_list', '');
            updateCounter();
            return;
        }

        // Tách dòng, lọc bỏ khoảng trắng thừa
        let lines = text.split('\n').map(item => item.trim()).filter(item => item !== '');
        
        // Lọc độc nhất (loại bỏ các email bị trùng lặp hoàn toàn)
        let uniqueLines = [...new Set(lines)];

        // Ghi ngược lại vào textarea nếu có thay đổi (đã lọc trùng)
        if (uniqueLines.length !== lines.length) {
            textarea.value = uniqueLines.join('\n');
        }

        localStorage.setItem('saved_email_list', textarea.value);
        updateCounter();
    }

    // Hàm cập nhật số lượng email còn lại
    function updateCounter() {
        const text = textarea.value.trim();
        if (text === "") {
            counter.innerHTML = `<span>📊</span> Số email còn lại: 0`;
            return;
        }
        const lines = text.split('\n').filter(item => item.trim() !== '');
        counter.innerHTML = `<span>📊</span> Số email còn lại: ${lines.length}`;
    }

    // Hiển thị thông báo nhỏ
    function showToast(message) {
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
</script>

</body>
</html>S
