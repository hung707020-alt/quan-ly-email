<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh sách Email Online</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
        }
        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #4a2d82;
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sub-title {
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            resize: vertical;
        }
        textarea::placeholder {
            color: #9ca3af;
        }
        /* Khu vực nút bấm thu nhỏ gọn, nằm chung 1 hàng hoặc sắp xếp gọn gàng */
        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-green { background-color: #28a745; }
        .btn-orange { background-color: #fd7e14; }
        .btn-red { background-color: #dc3545; }

        .counter {
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #customToast {
            background: #d4edda;
            color: #155724;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">✉️ Quản lý danh sách Email Online</div>
    <div class="sub-title">MAIL ĐÁNH</div>
    
    <div id="customToast">Đã lưu tự động!</div>

    <textarea id="emailListInput" placeholder="Dán danh sách email vào đây..."></textarea>
    
    <!-- Ô nhập chuỗi/email cần xóa nhanh khỏi danh sách -->
    <textarea id="emailToRemove" style="height: 60px;" placeholder="Nhập email hoặc từ khóa cần xóa bỏ khỏi danh sách trên..."></textarea>

    <div class="counter" id="emailCounter">Tổng số email: 0</div>

    <!-- Nhóm nút bấm nhỏ gọn nằm chung một form -->
    <div class="btn-group">
        <button class="btn-green" id="btnAdd">➕ Thêm/Gộp</button>
        <button class="btn-orange" id="btnRemoveSpecific">❌ Xóa chuỗi này</button>
        <button class="btn-red" id="btnClearAll">🗑️ Xóa hết</button>
    </div>
</div>

<script>
    const textarea = document.getElementById('emailListInput');
    const inputRemove = document.getElementById('emailToRemove');
    const counter = document.getElementById('emailCounter');
    const toast = document.getElementById('customToast');
    const btnAdd = document.getElementById('btnAdd');
    const btnRemoveSpecific = document.getElementById('btnRemoveSpecific');
    const btnClearAll = document.getElementById('btnClearAll');

    // 1. Tự động nạp dữ liệu cũ khi mở trang
    window.addEventListener('DOMContentLoaded', () => {
        const savedData = localStorage.getItem('saved_email_list');
        if (savedData !== null) {
            textarea.value = savedData;
            updateCounter();
        }
    });

    // 2. Tự động lưu ngầm khi gõ
    textarea.addEventListener('input', () => {
        saveAndRefresh();
        showToast("Đã tự động lưu!");
    });

    // 3. Nút Thêm / Gộp dữ liệu từ ô phụ vào danh sách chính
    btnAdd.addEventListener('click', () => {
        const currentText = textarea.value.trim();
        const newText = inputRemove.value.trim();
        if (!newText) {
            alert("Vui lòng nhập nội dung cần thêm vào ô phía dưới!");
            return;
        }
        textarea.value = currentText ? currentText + "\n" + newText : newText;
        inputRemove.value = '';
        saveAndRefresh();
        showToast("Đã thêm dữ liệu thành công!");
    });

    // 4. Nút Xóa các dòng/email trùng khớp với ô nhập phụ
    btnRemoveSpecific.addEventListener('click', () => {
        const target = inputRemove.value.trim();
        if (!target) {
            alert("Vui lòng nhập email hoặc từ khóa cần xóa vào ô phía dưới!");
            return;
        }
        
        let lines = textarea.value.split('\n');
        // Lọc bỏ những dòng chứa từ khóa/email cần xóa
        let filteredLines = lines.filter(line => !line.includes(target));
        
        textarea.value = filteredLines.join('\n');
        inputRemove.value = '';
        saveAndRefresh();
        showToast("Đã xóa các dòng khớp!");
    });

    // 5. Nút xóa sạch toàn bộ
    btnClearAll.addEventListener('click', () => {
        if (confirm("Bạn có chắc chắn muốn xóa hết danh sách không?")) {
            textarea.value = '';
            inputRemove.value = '';
            localStorage.removeItem('saved_email_list');
            updateCounter();
            showToast("Đã xóa toàn bộ dữ liệu!");
        }
    });

    // Hàm lưu vào localStorage và cập nhật số lượng
    function saveAndRefresh() {
        localStorage.setItem('saved_email_list', textarea.value);
        updateCounter();
    }

    // Hàm cập nhật số lượng dòng
    function updateCounter() {
        const text = textarea.value.trim();
        if (text === "") {
            counter.innerText = "Tổng số email: 0";
            return;
        }
        const lines = text.split('\n').filter(item => item.trim() !== '');
        counter.innerText = "Tổng số email: " + lines.length;
    }

    // Hiển thị thông báo nhỏ dạng Toast
    function showToast(message) {
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 2000);
    }
</script>

</body>
</html>
